name: ASV Benchmarks

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    # Check all PR
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write
  pages: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for ASV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asv virtualenv

      - name: Configure git for ASV
        run: |
          git config --global user.email "benchmark@example.com"
          git config --global user.name "Benchmark Bot"

      - name: Fetch existing results from gh-pages
        run: |
          if git ls-remote --exit-code origin gh-pages; then
            git fetch origin gh-pages:gh-pages
            if [ -d ".asv" ]; then rm -rf .asv; fi
            git checkout gh-pages -- .asv/results || true
          fi
        continue-on-error: true

      - name: Run ASV benchmarks
        run: |
          asv machine --yes
          asv run --quick --show-stderr HEAD^!

      - name: Generate HTML
        run: asv publish

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .asv/html
          destination_dir: benchmarks
          keep_files: true
