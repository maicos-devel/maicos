name: ASV Benchmarks

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    # Check all PR
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for ASV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asv virtualenv

      - name: Configure git for ASV
        run: |
          git config --global user.email "benchmark@example.com"
          git config --global user.name "Benchmark Bot"

      - name: Run ASV benchmarks
        run: |
          asv machine --yes
          asv run --quick --show-stderr HEAD^!

      - name: Compare benchmarks against main
        if: github.event_name == 'pull_request'
        run: |
          asv run --quick --show-stderr origin/main^!
          asv compare --factor 1.1 --split \
            $(git rev-parse origin/main) $(git rev-parse HEAD) \
            | tee benchmark_comparison.txt

      - name: Post benchmark comparison as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('benchmark_comparison.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '## Benchmark comparison\n```\n' + output + '\n```'
            });
