name: ASV Benchmarks

on:
  pull_request:
    # Check all PR
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read
  pull-requests: write

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    env:
      REGRESSION_FACTOR: "1.5"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history needed for ASV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install asv virtualenv

      - name: Configure git for ASV
        run: |
          git config --global user.email "benchmark@example.com"
          git config --global user.name "Benchmark Bot"

      - name: Run ASV benchmarks
        if: github.event_name == 'workflow_dispatch'
        run: |
          asv machine --yes
          asv run --quick --show-stderr HEAD^!

      - name: Compare benchmarks against main
        if: github.event_name == 'pull_request'
        run: |
          asv machine --yes
          asv run --quick --show-stderr origin/main^!
          asv run --quick --show-stderr HEAD^!
          asv compare --factor 1.1 --split \
            $(git rev-parse origin/main) $(git rev-parse HEAD) \
            | tee benchmark_comparison.txt
          asv compare --factor "$REGRESSION_FACTOR" \
            $(git rev-parse origin/main) $(git rev-parse HEAD) \
            > benchmark_regressions.txt
          if grep -qE '^\+\s+[0-9]' benchmark_regressions.txt; then
            echo "has_regression=true" >> "$GITHUB_ENV"
          else
            echo "has_regression=false" >> "$GITHUB_ENV"
          fi

      - name: Post benchmark comparison as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('benchmark_comparison.txt', 'utf8');
            const hasRegression = process.env.has_regression === 'true';
            const factor = process.env.REGRESSION_FACTOR;
            const verdict = hasRegression
              ? `💥 Yikes! Benchmark regression exceeding ${factor}x detected vs \`main\` — performance took a hit. 🐌`
              : `🚀 All clear! No benchmark regressions exceeding ${factor}x — performance is looking great. ✨`;
            const marker = '<!-- asv-benchmark-comparison -->';
            const body = `${marker}\n## Benchmark comparison\n${verdict}\n\`\`\`\n${output}\n\`\`\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.startsWith(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Fail CI on benchmark regression
        if: always() && github.event_name == 'pull_request' && env.has_regression == 'true'
        run: |
          echo "--- Regressions exceeding ${REGRESSION_FACTOR}x ---"
          grep -E '^\+\s+[0-9]' benchmark_regressions.txt
          exit 1
