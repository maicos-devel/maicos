[tox]
minversion = 4.9.0
# these are the environments that will run when you
# execute `tox` in the command-line
# bellow you will find explanations for all environments
envlist =
    lint
    build
    tests
    docs

lint_folders =
    "{toxinidir}/src" \
    "{toxinidir}/tests" \
    "{toxinidir}/examples" \
    "{toxinidir}/benchmarks" \
    "{toxinidir}/docs/src/"

# configures which environments run with each python version
[testenv]
# Passing through all enviroment variables to tox jobs
passenv = *
platform =
    linux: linux
    macos: darwin
    windows: win32

# Default package_env, used for building source distribution
[testenv:.pkg]

# configures the unittest environment
[testenv:tests]
description = Run test suite with pytest and {basepython}.
setenv =
    PYTHONPATH={toxinidir}/tests
    PYTHONUNBUFFERED=yes
usedevelop = true
deps = -r tests/requirements.txt
commands =
    # Run unit tests
    pytest {posargs}

    # Run documentation tests on all Python files and the README.rst
    pytest --doctest-modules --pyargs maicos

[testenv:tests-dev]
description = Run test suite against MDAnalysis dev version
deps = 
    -r tests/requirements.txt
    MDAnalysis @ git+https://github.com/MDAnalysis/mdanalysis.git\#subdirectory=package
    MDAnalysisTests @ git+https://github.com/MDAnalysis/mdanalysis.git\#subdirectory=testsuite
commands =
    pytest {posargs}

[testenv:lint]
description = Run linters and type checks
package = skip
deps =
    ruff
    mypy
    sphinx-lint
commands =
    ruff format --diff {[tox]lint_folders}
    ruff check {[tox]lint_folders}
    mypy {[tox]lint_folders}
    sphinx-lint \
        --enable all \
        --disable line-too-long \
        -i "{toxinidir}/docs/src/generated_examples" \
        -i "{toxinidir}/docs/src/get-started/generated_tabs" \
        {[tox]lint_folders} "{toxinidir}/README.rst"

[testenv:build]
platform =
    linux: linux
    macos: darwin
    windows: win32
description = Asserts package build integrity for {platform} with {basepython}.
usedevelop = true
deps =
    build
    check-manifest
    twine
allowlist_externals =
    linux: bash
    macos: zsh
    windows: foreach

commands_pre = python {toxinidir}/developer/clean_dist_check.py
commands =
    python -m build
    twine check dist/*.tar.gz dist/*.whl
    check-manifest {toxinidir}
    # Workaround using shells since tox does not support wildcards
    linux: bash -c "python -m pip install --force-reinstall dist/maicos-*.tar.gz"
    linux: bash -c "python -m pip install --force-reinstall dist/maicos-*.whl"
    macos: zsh -c "python -m pip install --force-reinstall dist/maicos-*.tar.gz"
    macos: zsh -c "python -m pip install --force-reinstall dist/maicos-*.whl"
    windows: foreach ($i in ls dist\*.tar.gz) \{pip install --force-reinstall $i\}
    windows: foreach ($i in ls dist\*.whl) \{pip install --force-reinstall $i\}

[testenv:docs]
description = Building the package documentation.
usedevelop = true
deps = -r docs/requirements.txt
extras = examples
allowlist_externals =
    bash
commands =
    # Run all .sh files in the example folder (including subfolders)
    bash -c "set -e && for f in $(find examples docs/src/get-started/tabs -name '*.sh'); do cd $(dirname $f); bash $(basename $f); cd -; done"

    sphinx-build \
        {posargs:-E} \
        --builder html \
        --doctree-dir docs/build/doctree \
        --fail-on-warning \
        docs/src docs/build/html

[testenv:format]
description = Abuse tox to do actual formatting on all files.
package = skip
deps = ruff
commands =
    ruff format {[tox]lint_folders}
    ruff check --fix-only {[tox]lint_folders} "{toxinidir}/README.rst" {posargs}

[testenv:benchmarks]
description = Run ASV benchmarks on current commit.
usedevelop = true
deps = -r benchmarks/requirements.txt
allowlist_externals =
    bash
    zsh
commands =
    # Run benchmarks on the current commit
    asv run --quick --show-stderr {posargs:HEAD^!}

[testenv:benchmarks-html]
description = Run ASV benchmarks and generate HTML results page.
usedevelop = true
deps = -r benchmarks/requirements.txt
allowlist_externals =
    bash
    zsh
commands =
    # Run benchmarks on the current commit
    asv run --quick --show-stderr {posargs:HEAD^!}
    # Generate HTML results page
    asv publish
    # Show results in browser (optional - comment out for CI)
    # asv preview

[testenv:benchmarks-compare]
description = Compare benchmarks between current branch and main.
usedevelop = true
deps = -r benchmarks/requirements.txt
allowlist_externals =
    bash
    zsh
commands =
    asv run --quick --show-stderr origin/main^!
    asv run --quick --show-stderr HEAD^!
    bash -c "asv compare $(git rev-parse origin/main) $(git rev-parse HEAD) --factor 1.1 --split"
